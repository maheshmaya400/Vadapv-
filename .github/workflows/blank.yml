name: Ubuntu VPS
on: [workflow_dispatch]
jobs:
  vps:
    runs-on: ubuntu-latest
    steps:
      - name: Install ngrok
        run: |
          wget -q https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-linux-amd64.zip
          unzip -q ngrok-v3-stable-linux-amd64.zip
      - name: Authenticate ngrok
        run: ./ngrok authtoken $NGROK_AUTH_TOKEN
        env:
          NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
      - name: Enable SSH & set password
        run: |
          sudo systemctl start ssh
          echo "runner:password123" | sudo chpasswd
      - name: Start ngrok tunnel
        run: |
          ./ngrok tcp 22 > ngrok.log &
          sleep 5
      - name: Print SSH command
        run: |
          echo "=============================="
          echo "Username: runner"
          echo "Password: password123"
          grep -o 'tcp://.*' ngrok.log | sed 's#tcp://#ssh runner@#' | sed 's#:# -p #'
          echo "=============================="
      - name: Keep alive
        run: sleep 21600


