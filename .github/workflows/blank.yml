
name: Ubuntu VPS SSH

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ubuntu-vps:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Install dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            openssh-server \
            curl \
            jq \
            unzip

      - name: Configure SSH access
        shell: bash
        env:
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
        run: |
          if [ -z "$SSH_PUBLIC_KEY" ]; then
            echo "SSH_PUBLIC_KEY secret is missing"
            exit 1
          fi

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$SSH_PUBLIC_KEY" \
            >> "$HOME/.ssh/authorized_keys"

          chmod 600 "$HOME/.ssh/authorized_keys"

          sudo tee /etc/ssh/sshd_config.d/99-vps.conf > /dev/null <<EOF
          PubkeyAuthentication yes
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          PermitRootLogin no
          AllowUsers runner
          EOF

          sudo sshd -t
          sudo systemctl enable --now ssh
          sudo systemctl restart ssh

      - name: Install ngrok
        shell: bash
        run: |
          curl -fsSL \
            https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-linux-amd64.zip \
            -o ngrok.zip

          unzip -q ngrok.zip
          sudo install ngrok /usr/local/bin/ngrok

          ngrok version

      - name: Authenticate ngrok
        shell: bash
        env:
          NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
        run: |
          if [ -z "$NGROK_AUTH_TOKEN" ]; then
            echo "NGROK_AUTH_TOKEN secret is missing"
            exit 1
          fi

          ngrok config add-authtoken "$NGROK_AUTH_TOKEN"

      - name: Start SSH tunnel
        shell: bash
        run: |
          nohup ngrok tcp 22 --log=stdout \
            > "$RUNNER_TEMP/ngrok.log" 2>&1 &

          echo $! > "$RUNNER_TEMP/ngrok.pid"

          TUNNEL=""

          for i in $(seq 1 40); do
            TUNNEL=$(curl -fsS \
              http://127.0.0.1:4040/api/tunnels \
              | jq -r \
              '.tunnels[]? | select(.proto=="tcp") | .public_url' \
              | head -n 1 || true)

            if [ -n "$TUNNEL" ]; then
              break
            fi

            sleep 3
          done

          if [ -z "$TUNNEL" ]; then
            echo "Could not establish ngrok tunnel"
            cat "$RUNNER_TEMP/ngrok.log"
            exit 1
          fi

          ADDRESS="${TUNNEL#tcp://}"
          HOST="${ADDRESS%:*}"
          PORT="${ADDRESS##*:}"

          echo "HOST=$HOST" >> "$GITHUB_OUTPUT"
          echo "PORT=$PORT" >> "$GITHUB_OUTPUT"

          echo "=================================="
          echo "Ubuntu VPS is ready!"
          echo "Username: runner"
          echo "Host: $HOST"
          echo "Port: $PORT"
          echo "=================================="

      - name: Keep VPS alive
        shell: bash
        run: |
          echo "Ubuntu VPS running..."
          sleep 21000
